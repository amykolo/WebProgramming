<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Box Model Lab</title>

<style>
/* Page styling */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding: 20px;
}

/* Heading */
h1 {
    text-align: center;
}

/* Box Model */
.box {
    border: 5px solid blue;
    padding: 20px;
    margin: 20px;
    background-color: lightgray;

    width: 300px;
    height: 150px;

    box-sizing: border-box;
}

/* Second box */
.box2 {
    width: 400px;
    height: 200px;
}
</style>

</head>

<body>

<h1>CSS Box Model Lab</h1>

<div class="box">
    <p>This is a demonstration of the CSS Box Model.</p>
</div>

<!-- Second box for the experiment -->
<div class="box box2">
    <p>This is another box to show how margins create space between elements.</p>
</div>

</body>
</html>
