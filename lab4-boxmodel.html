<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Box Model Lab</title>

<style>
/* Page styling */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding: 20px;
}

/* Heading */
h1 {
    text-align: center;
}

/* Box Model */
.box {
    border: 5px solid blue;      /* 5px blue border */
    padding: 20px;               /* 20px padding */
    margin: 20px;                /* 20px margin */
    background-color: lightgray; /* Light gray background */

    width: 300px;                /* Width for experiment */
    height: 150px;               /* Height for experiment */

    box-sizing: border-box;      /* Includes padding and border in width/height */
}
</style>

</head>

<body>

<h1>CSS Box Model Lab</h1>

<div class="box">
    <p>This is a demonstration of the CSS Box Model.</p>
</div>

<!-- Second box for the experiment -->
<div class="box">
    <p>This is another box to show how margins create space between elements.</p>
</div>

</body>
</html>
